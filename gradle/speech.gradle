// Build inputs use versioned URLs and fixed SHA-256 checksums.
def source = 'https://github.com/k2-fsa/sherpa-onnx/releases/download'
def sherpa = 'v1.12.39'
def voiceModel = 'kokoro-int8-multi-lang-v1_1'
def apiJar = "sherpa-onnx-${sherpa}.jar"
def nativeJar = "sherpa-onnx-native-lib-win-x64-${sherpa}.jar"
def assets = [
    'whisper-bin-x64.zip': [
        url: 'https://github.com/ggml-org/whisper.cpp/releases/download/v1.7.6/whisper-bin-x64.zip',
        sha: '0d2eca299c248f965bd0341bcb219db4b433c7f0c0ce2200d4df85765e8156a9'
    ],
    'ggml-small.en-q5_1.bin': [
        url: 'https://huggingface.co/ggerganov/whisper.cpp/resolve/98aa99a0a9db05ae2342309f5096248665f7cba3/ggml-small.en-q5_1.bin',
        sha: 'bfdff4894dcb76bbf647d56263ea2a96645423f1669176f4844a1bf8e478ad30'
    ],
    (apiJar): [
        url: "${source}/${sherpa}/${apiJar}",
        sha: 'de3a318274fadaf52bfdb24a44a263f47e510b75212562d6815b5fcf143048f8'
    ],
    (nativeJar): [
        url: "${source}/${sherpa}/${nativeJar}",
        sha: '41e2421fb7ee67cc420ca66e6ff1d405b95e25575506c3ee52673cb4b184f79d'
    ],
    ("${voiceModel}.tar.bz2"): [
        url: "${source}/tts-models/${voiceModel}.tar.bz2",
        sha: '259c9c8bc906d6078e4e0570421885dabb68b539c2f970fcbb890a58eeaf3e9c'
    ]
]
def inputsDir = layout.projectDirectory.dir('third_party')
def speechResources = layout.buildDirectory.dir('generated/speech-resources-v2')
def speechPath = 'assets/englishmc/speech'

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        new java.security.DigestOutputStream(OutputStream.nullOutputStream(), digest).withCloseable { output ->
            input.transferTo(output)
        }
    }
    digest.digest().encodeHex().toString()
}

def fetchSpeechInputs = tasks.register('fetchSpeechInputs') {
    inputs.property('artifacts', assets)
    outputs.files(assets.keySet().collect { inputsDir.file(it) })
    doLast {
        File inputFolder = inputsDir.asFile
        inputFolder.mkdirs()
        assets.each { name, asset ->
            File destination = new File(inputFolder, name)
            if (!destination.isFile()) {
                if (gradle.startParameter.offline) {
                    throw new GradleException("Missing ${destination}. Build once online or supply the pinned input.")
                }
                File download = File.createTempFile('englishmc-', '.part', inputFolder)
                try {
                    def connection = URI.create(asset.url).toURL().openConnection()
                    connection.connectTimeout = 20000
                    connection.readTimeout = 90000
                    connection.inputStream.withCloseable { input ->
                        download.withOutputStream { output -> input.transferTo(output) }
                    }
                    if (sha256(download) != asset.sha) throw new GradleException("Checksum mismatch for ${name}")
                    java.nio.file.Files.move(download.toPath(), destination.toPath())
                } finally {
                    download.delete()
                }
            }
            if (sha256(destination) != asset.sha) throw new GradleException("Checksum mismatch for ${destination}")
        }
    }
}

sourceSets {
    voiceWorker {
        compileClasspath += files(inputsDir.file(apiJar)).builtBy(fetchSpeechInputs)
    }
}

def voiceWorkerJar = tasks.register('voiceWorkerJar', Jar) {
    from(sourceSets.voiceWorker.output)
    destinationDirectory = layout.buildDirectory.dir('speech-worker')
    archiveFileName = 'englishmc-voice-worker.jar'
}

def nativeVoice = tasks.register('packageNeuralVoice', Zip) {
    dependsOn fetchSpeechInputs
    dependsOn voiceWorkerJar
    from(voiceWorkerJar.flatMap { it.archiveFile })
    from(inputsDir.file(apiJar)) { rename { 'sherpa-api.jar' } }
    from(inputsDir.file(nativeJar)) { rename { 'sherpa-win-x64.jar' } }
    from({ tarTree(resources.bzip2(inputsDir.file("${voiceModel}.tar.bz2").asFile)) })
    destinationDirectory = speechResources.map { it.dir(speechPath) }
    archiveFileName = 'kokoro.zip'
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

def recognizer = tasks.register('packageLocalRecognizer', Zip) {
    dependsOn fetchSpeechInputs
    from({ zipTree(inputsDir.file('whisper-bin-x64.zip')) }) {
        include 'Release/whisper-cli.exe', 'Release/whisper.dll', 'Release/ggml.dll',
            'Release/ggml-base.dll', 'Release/ggml-cpu.dll'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    from inputsDir.file('ggml-small.en-q5_1.bin')
    destinationDirectory = speechResources.map { it.dir(speechPath) }
    archiveFileName = 'whisper.zip'
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

sourceSets.main.resources.srcDir speechResources
tasks.named('processResources').configure { dependsOn recognizer, nativeVoice }
